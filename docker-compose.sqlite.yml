version: '3.9'

services:
  app:
    build:
      context: .
      target: app-sqlite
    image: wewe-rss-sqlite:local
    ports:
      - 4000:4000
    environment:
      # 数据库连接地址
      # - DATABASE_URL=file:../data/wewe-rss.db
      - DATABASE_TYPE=sqlite
      # 服务接口请求授权码
      - AUTH_CODE=123567
      # 使用本地微信读书账号提供器；原远程提供器仍保留
      - WEREAD_ACCOUNT_PROVIDER=local
      # 建议在同目录 .env 中设置随机长字符串；未设置时回退使用 AUTH_CODE
      - WEREAD_SESSION_SECRET=${WEREAD_SESSION_SECRET:-}
      # 本地会话主动续期间隔（小时）
      - WEREAD_RENEW_INTERVAL_HOURS=6
      # 提取全文内容模式
      # - FEED_MODE=fulltext
      # 定时更新订阅源Cron表达式
      # - CRON_EXPRESSION=35 5,17 * * *
      # 服务接口请求限制，每分钟请求次数
      # - MAX_REQUEST_PER_MINUTE=60
      # 外网访问时，需设置为服务器的公网 IP 或者域名地址
      # - SERVER_ORIGIN_URL=http://localhost:4000

    volumes:
      # 映射数据库文件存储位置，容器重启后不丢失
      - ./data:/app/data
